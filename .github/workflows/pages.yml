name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Validate production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      PAGES_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit and integration tests
        run: pnpm test
      - name: Verify bundled assets
        run: pnpm assets:verify
      - name: Build for the project subdirectory
        run: pnpm build --base="$PAGES_BASE"
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production startup and store entry
        env:
          CITY_PRODUCTION_URL: http://127.0.0.1:4173${{ env.PAGES_BASE }}
        run: |
          mkdir -p artifacts
          pnpm preview --base="$PAGES_BASE" --port 4173 --strictPort > artifacts/production-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$CITY_PRODUCTION_URL" > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:production
      - name: Upload browser verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke
          path: artifacts/production-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload verified Pages bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified bundle
        id: deployment
        uses: actions/deploy-pages@v5
